# TypeScript - Internal
# Prototype, plus the checks that stop a repo rotting quietly, which are the
# ones that cannot be satisfied without doing the work.

[code.linting.eslint]
enabled = true
max-warnings = 0
ignore = ["**/dist/**", "**/build/**", "**/node_modules/**", "**/coverage/**"]

[code.types.tsc]
enabled = true

[code.types.tsc.require]
strict = true
noUnusedLocals = true
noUnusedParameters = true
noImplicitReturns = true
noFallthroughCasesInSwitch = true
esModuleInterop = true
forceConsistentCasingInFileNames = true

[code.unused.knip]
enabled = true

# Code written twice: every clone of 100 tokens or more outside the tests is a
# finding. The only way to clear one is to merge the copies.
[code.duplication.jscpd]
enabled = true
min_tokens = 100
# Tests are code written to read alike, so they're left out: test files by
# name anywhere, and the top-level test folders. A folder named tests deeper
# in the source (a quiz's UI, say) is code like any other and is checked.
ignore = [
  "**/*.test.*", "**/*.spec.*", "test/**", "tests/**", "e2e/**",
  "**/__tests__/**",
]

# No budget on purpose: a repo paying down existing suppressions sets its own
# `max` locally and lowers it as they go.
[code.quality.disable-comments]
enabled = true
extensions = ["ts", "tsx", "js", "mjs"]

# File and folder names: kebab-case for code. Only these extensions are judged,
# so README.md, CLAUDE.md and JSON or YAML files are never checked. Scripts
# in .js or .mjs are code and are judged like any other; a dotted config name
# such as vite.config.ts passes. A folder is judged only when it holds a file a
# rule matched.
[code.naming]
enabled = true

[[code.naming.rules]]
extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]
file_case = "kebab-case"
folder_case = "kebab-case"

# Mutation testing: conform changes the code in small ways and runs the
# tests against each change. The score is the share of changes the tests
# catch, of those in code they run. 40 at internal. A repo measured under it
# writes its real number here locally, with a comment saying it ratchets.
[code.mutation_score]
enabled = true
min_score = 40

[code.security.secrets]
enabled = true
scan_mode = "branch"
base_branch = "main"

[process.forbidden_files]
enabled = true
scope = "git"
files = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12", "**/id_rsa*",
  "coverage/**", "dist/**", "build/**", "**/*.tsbuildinfo",
]
ignore = ["**/node_modules/**", "**/.env.example", "**/*.pub"]
message = "Credentials belong in the environment and build output in .gitignore."
