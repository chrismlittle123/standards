# Python - Production
# Internal, plus the dependencies audited. Coverage has an 80% floor.

[code.linting.ruff]
enabled = true

[code.types.ty]
enabled = true

[code.unused.vulture]
enabled = true

[code.quality.disable-comments]
enabled = true
extensions = ["py"]

[code.security.pipaudit]
enabled = true

# File and folder names: snake_case, because a module with a hyphen cannot be
# imported. Names starting with an underscore (__init__.py, _private.py) are
# skipped by conform, and only .py files are judged.
[code.naming]
enabled = true

[[code.naming.rules]]
extensions = ["py"]
file_case = "snake_case"
folder_case = "snake_case"

# Production's floor: the suite runs and line coverage must reach 80%. A repo
# measured under it writes its real number here locally, with a comment saying
# it ratchets back up.
[code.coverage_measured]
enabled = true
min_threshold = 80

[code.security.secrets]
enabled = true
scan_mode = "branch"
base_branch = "main"

[process.forbidden_files]
enabled = true
scope = "git"
files = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12", "**/id_rsa*",
  "**/__pycache__/**", "**/*.egg-info/**", "coverage/**", ".coverage",
]
ignore = ["**/.venv/**", "**/.env.example", "**/*.pub"]
message = "Credentials belong in the environment and build output in .gitignore."
