# TypeScript - Prototype
# Nothing is lost if this repo breaks, but a leaked key costs the same here as
# anywhere. So: it must compile, it must lint, and nothing secret is committed.

[code.linting.eslint]
enabled = true
max-warnings = 0
ignore = ["**/dist/**", "**/build/**", "**/node_modules/**", "**/coverage/**"]

[code.types.tsc]
enabled = true

[code.types.tsc.require]
strict = true

# Code written twice: clones of 100 tokens or more outside the tests, allowed
# up to 5% of the code.
[code.duplication.jscpd]
enabled = true
min_tokens = 100
threshold = 5
# Tests are code written to read alike, so they're left out: test files by
# name anywhere, and the top-level test folders. A folder named tests deeper
# in the source (a quiz's UI, say) is code like any other and is checked.
ignore = [
  "**/*.test.*", "**/*.spec.*", "test/**", "tests/**", "e2e/**",
  "**/__tests__/**",
]

# File and folder names: kebab-case for code. Only these extensions are judged,
# so README.md, CLAUDE.md and JSON or YAML files are never checked. Scripts
# in .js or .mjs are code and are judged like any other; a dotted config name
# such as vite.config.ts passes. A folder is judged only when it holds a file a
# rule matched.
[code.naming]
enabled = true

[[code.naming.rules]]
extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]
file_case = "kebab-case"
folder_case = "kebab-case"

[code.security.secrets]
enabled = true
scan_mode = "branch"
base_branch = "main"

[process.forbidden_files]
enabled = true
scope = "git"
files = ["**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12", "**/id_rsa*"]
ignore = ["**/node_modules/**", "**/.env.example", "**/*.pub"]
message = "Credentials belong in the environment, not in the repository."
