# TypeScript - Production
# Internal, plus a pinned list of rules nobody can quietly downgrade, one more
# compiler flag, an 80% coverage floor and the dependencies audited.
#
# A repo with its own commit prefixes adds them to types.

[code.linting.eslint]
enabled = true
max-warnings = 0
ignore = ["**/dist/**", "**/build/**", "**/node_modules/**", "**/coverage/**"]

[code.types.tsc]
enabled = true

[code.types.tsc.require]
strict = true
noUnusedLocals = true
noUnusedParameters = true
noImplicitReturns = true
noFallthroughCasesInSwitch = true
esModuleInterop = true
forceConsistentCasingInFileNames = true
exactOptionalPropertyTypes = true

# Short on purpose, and all correctness rather than style: every one catches a
# bug that ships. Style limits (max-lines, complexity) are left out because the
# cheapest way to satisfy them is to split a file badly.
[code.linting.eslint.rules]
"@typescript-eslint/no-floating-promises" = "error"
"@typescript-eslint/no-misused-promises" = "error"
"@typescript-eslint/await-thenable" = "error"
"@typescript-eslint/no-for-in-array" = "error"
"@typescript-eslint/no-unnecessary-type-assertion" = "error"
"@typescript-eslint/no-base-to-string" = "error"
"@typescript-eslint/no-explicit-any" = "error"
"eqeqeq" = "error"
"no-var" = "error"
"prefer-const" = "error"
"no-eval" = "error"

[code.unused.knip]
enabled = true

# No budget on purpose: a repo paying down existing suppressions sets its own
# `max` locally and lowers it as they go.
[code.quality.disable-comments]
enabled = true
extensions = ["ts", "tsx", "js", "mjs"]

# File and folder names: kebab-case for code. Only these extensions are judged,
# so README.md, CLAUDE.md, configs and scripts are never checked, and a folder
# is judged only when it holds a file a rule matched.
[code.naming]
enabled = true

[[code.naming.rules]]
extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]
file_case = "kebab-case"
folder_case = "kebab-case"

# Production's floor: the suite runs and line coverage must reach 80%. A repo
# measured under it writes its real number here locally, with a comment saying
# it ratchets back up.
[code.coverage_measured]
enabled = true
min_threshold = 80

[code.security.pnpmaudit]
enabled = true

[code.security.secrets]
enabled = true
scan_mode = "branch"
base_branch = "main"

# The runner's own config (vitest, jest or nyc) keeps coverage thresholds, so
# nobody quietly deletes them. TypeScript only: conform cannot read a pytest
# threshold, and there is no CI to enforce one in.
[process.coverage_configured]
enabled = true
enforce_in = "config"

[process.forbidden_files]
enabled = true
scope = "git"
files = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12", "**/id_rsa*",
  "coverage/**", "dist/**", "build/**", "**/*.tsbuildinfo",
]
ignore = ["**/node_modules/**", "**/.env.example", "**/*.pub"]
message = "Credentials belong in the environment and build output in .gitignore."

[process.commits]
enabled = true
types = ["feat", "fix", "chore", "docs", "refactor", "test", "style", "perf", "ci", "build"]
require_scope = false
max_subject_length = 100

[process.branches]
enabled = true
pattern = "^(feat|fix|chore|docs|refactor|test|style|perf|ci|build|hotfix|release|session)/[a-z0-9][a-z0-9._-]*$"
exclude = ["main"]
