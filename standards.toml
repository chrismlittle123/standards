# standards - internal. The registry itself: nine ruleset templates, no
# guidelines and no git hooks. No TypeScript and no Python, so no language
# ruleset applies and it names none.
[metadata]
tier = "internal"
project = "standards"

[code.security.secrets]
enabled = true
scan_mode = "branch"
base_branch = "main"

[process.forbidden_files]
enabled = true
scope = "git"
files = ["**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*"]
ignore = ["**/.env.example", "**/*.pub"]

[process.commits]
enabled = true
types = ["feat", "fix", "chore", "docs", "refactor", "test", "style", "perf", "ci", "build"]
max_subject_length = 100

[process.docs]
enabled = true
allowlist = ["README.md", "CLAUDE.md", "CHANGELOG.md"]
