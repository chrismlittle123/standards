# Python - Production
# Internal, plus the dependencies audited, and size and complexity limits.
# Coverage has an 80% floor.

# On top of the repo's own ruff rules: complexity over 15 (C901), more than 5
# arguments (PLR0913) and more than 50 statements in a function (PLR0915),
# loose enough to catch only the outliers, as in the TypeScript template.
# A repo over them sets its own higher numbers here locally, with a comment
# saying they ratchet down. Needs conform 2.6.0.
[code.linting.ruff]
enabled = true

[code.linting.ruff.lint]
extend-select = ["C901", "PLR0913", "PLR0915"]
mccabe = { max-complexity = 15 }
pylint = { max-args = 5, max-statements = 50 }

[code.types.ty]
enabled = true

[code.unused.vulture]
enabled = true

[code.quality.disable-comments]
enabled = true
extensions = ["py"]

[code.security.pipaudit]
enabled = true

# File and folder names: snake_case, because a module with a hyphen cannot be
# imported. Names starting with an underscore (__init__.py, _private.py) are
# skipped by conform, and only .py files are judged.
[code.naming]
enabled = true

[[code.naming.rules]]
extensions = ["py"]
file_case = "snake_case"
folder_case = "snake_case"

# Production's floor: the suite runs and line coverage must reach 80%. A repo
# measured under it writes its real number here locally, with a comment saying
# it ratchets back up.
[code.coverage_measured]
enabled = true
min_threshold = 80

# Code written twice, outside the tests. Every clone of 50 tokens or more
# is a finding. Tests are code written to read alike, so they're left
# out: test files by name anywhere, and the top-level test folders.
[code.duplication.jscpd]
enabled = true
min_tokens = 50
ignore = [
  "**/test_*.py", "**/*_test.py", "**/conftest.py", "test/**", "tests/**",
]

# Mutation testing: conform changes the code in small ways and runs the
# tests against each change. The score is the share of changes the tests
# catch, of those in code they run. 60 at production. A repo measured under
# it writes its real number here locally, with a comment saying it ratchets.
# Only the code a branch changes against main is mutated, so a run costs
# about what the change does; on main itself the check is skipped.
[code.mutation_score]
enabled = true
min_score = 60
scope = "changed"
base_branch = "main"

[code.security.secrets]
enabled = true
scan_mode = "branch"
base_branch = "main"

[process.forbidden_files]
enabled = true
scope = "git"
files = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12", "**/id_rsa*",
  "**/__pycache__/**", "**/*.egg-info/**", "coverage/**", ".coverage", "mutants/**",
]
ignore = ["**/.venv/**", "**/.env.example", "**/*.pub"]
message = "Credentials belong in the environment and build output in .gitignore."
